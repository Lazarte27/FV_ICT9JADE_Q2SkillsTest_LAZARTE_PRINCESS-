<h1> OBMC Student Enrollment Form</h1> 
<p>Fill out the form below to enroll for the upcoming school year</p>

 <div class="col-md-5">
                <div class="fillup shadow">
                    <h2 class="mb-4">Student Information</h2>

                    <form>
                        <label for="first name" class="form-label">First Name</label>
                        <input type="first name" class="form-control mb-3" id=First name" placeholder="Juan" required>

                        <label for="last name" class="form-label">Last Name</label>
                        <input type="last name" class="form-control mb-3" id="last name" placeholder="Dela Cruz" required>

                      <div class="mb-3">
                        <label for="date" class="form-label">Birth Date</label>
                       <input type="date" class="form-control" id="date" name="date">
                       </div>

                      <div class="mb-3">
                       <label for="gender" class="form-label">Gender:</label>
                       <select class="form-select" id="gender" name="gender" required>
                       <option value="" selected disabled>Select</option>
                       <option value="Male">Male</option>
                       <option value="Female">Female</option>
                       </select>
                       </div>

                      <div class="mb-3">
                       <label for="grade level" class="form-label">Grade Level:</label>
                       <select class="form-select" id="grade-evel" name="grade-level" required>
                       <option value="" selected disabled>Select</option>
                       <option value="Male">Male</option>
                       <option value="Female">Female</option>
                       </select>
                       </div>
                    
                      <h2>Contact Details</h2>
                        
                      <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control mb-3" id=email name" placeholder="delacruz.@jagmail.com" required>

                      <label for="contact-number" class="form-label">Contact Number</label>
                        <input type="contact-number" class="form-control mb-3" id=contact-number name" placeholder="0912 - 345 - 6789" required>
                      
                      <h2>Other Information</h2>
                      <p> Mode of Learning:</p>
                      <div>
                      <input type="radio" id="online" name="mode_of_learning" value="online">
                      <label for="online">Online</label>
                      </div>
                      <div>
                      <input type="radio" id="face_to_face" name="mode_of_learning" value="face_to_face">
                      <label for="face_to_face">Face-to-Face</label>
                      </div>
                      <br>
                      <div>
                      <input type="checkbox" id="confirm" name="confirm" required>
                      <label for="confirm">I confirm that the information provided is true and complete.</label>
                      </div>
                         <button type="submit" class="btn btn-primary w-100">Submit Enrollment</button required>
                    </form>
